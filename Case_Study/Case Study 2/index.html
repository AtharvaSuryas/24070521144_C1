<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping Bill Calculator</title>
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Online Shopping Checkout & Bill</h2>
    <form id="billForm">
        <div class="form-group">
            <label for="custName">Customer Name:</label>
            <input type="text" id="custName" required placeholder="Enter name">
        </div>
        <div class="form-group">
            <label for="mobNo">Mobile Number:</label>
            <input type="tel" id="mobNo" required placeholder="10-digit mobile number">
        </div>
        <div class="form-group">
            <label for="invNo">Invoice Number:</label>
            <input type="text" id="invNo" required value="INV-2026-001">
        </div>
        <div class="form-group">
            <label for="prodName">Product Name:</label>
            <input type="text" id="prodName" required placeholder="e.g., Organic Sugar">
        </div>
        <div class="form-group">
            <label for="qtyKg">Quantity (in kg):</label>
            <input type="number" id="qtyKg" step="0.1" min="0.1" required value="1">
        </div>
        <div class="form-group">
            <label for="rateKg">Rate per kg (₹):</label>
            <input type="number" id="rateKg" step="1" min="0" required value="100">
        </div>
        <div class="form-group">
            <label for="discountPct">Discount (%):</label>
            <input type="number" id="discountPct" step="0.1" min="0" max="100" value="5">
        </div>
        <div class="form-group">
            <label for="gstPct">GST (%):</label>
            <input type="number" id="gstPct" step="0.1" min="0" max="100" value="5">
        </div>
        <div class="form-group">
            <label for="packingCharges">Packing Charges (₹):</label>
            <input type="number" id="packingCharges" step="1" min="0" value="20">
        </div>
        <div class="form-group">
            <label for="membership">Membership Type:</label>
            <select id="membership">
                <option value="none">None (0% extra off)</option>
                <option value="silver">Silver (2% extra off)</option>
                <option value="gold">Gold (5% extra off)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="paymentMode">Payment Mode:</label>
            <select id="paymentMode">
                <option value="UPI">UPI</option>
                <option value="Card">Credit/Debit Card</option>
                <option value="COD">Cash on Delivery</option>
            </select>
        </div>
        <button type="button" id="calcBtn">Calculate Bill</button>
    </form>

    <div class="bill-summary" id="billSummary">
        <h3>Invoice Details</h3>
        <div class="bill-row"><span>Customer:</span> <span id="outName"></span></div>
        <div class="bill-row"><span>Mobile:</span> <span id="outMob"></span></div>
        <div class="bill-row"><span>Invoice ID:</span> <span id="outInv"></span></div>
        <div class="bill-row"><span>Product:</span> <span id="outProd"></span></div>
        <div class="bill-row"><span>Gross Price:</span> <span id="outGross"></span></div>
        <div class="bill-row"><span>Discount Applied:</span> <span id="outDisc"></span></div>
        <div class="bill-row"><span>Packing Charges:</span> <span id="outPack"></span></div>
        <div class="bill-row"><span>GST Amount:</span> <span id="outGst"></span></div>
        <div class="bill-row"><span>Payment & Membership:</span> <span id="outMeta"></span></div>
        <div class="bill-row total-row"><span>Final Payable:</span> <span id="outTotal"></span></div>
    </div>
</div>

<!-- Link to external JS file -->
<script src="script.js"></script>
</body>
</html>
