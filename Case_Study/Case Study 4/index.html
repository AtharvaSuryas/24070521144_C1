<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24070521144  </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        input [type="text"] {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .weak {
            color: #dc3545;
        }
        .strong {
            color: #28a745;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>PIN Strength Checker</h2>
    <p>Enter your PIN below to check its strength.</p>
    <input type="text" id="pinInput" placeholder="Enter PIN" maxlength="8">
    <br>
    <button onclick="checkPinStrength()">Check Strength</button>
    <div id="result"></div>
</div>

<script>
function checkPinStrength() {
    const pinInput = document.getElementById('pinInput').value;
    const resultDiv = document.getElementById('result');
    
    // Clear previous results and check for empty input
    resultDiv.innerHTML = '';
    if (!pinInput) {
        resultDiv.innerHTML = 'Please enter a PIN.';
        resultDiv.className = '';
        return;
    }

    // Reverse the string to check for palindrome
    const reversedPin = pinInput.split('').reverse().join('');

    if (pinInput === reversedPin) {
        resultDiv.innerHTML = '⚠️ Weak PIN (Palindrome)';
        resultDiv.className = 'weak';
    } else {
        resultDiv.innerHTML = '✅ Strong PIN';
        resultDiv.className = 'strong';
    }
}
</script>

</body>
</html>
