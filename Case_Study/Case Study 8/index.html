<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --error: #dc2626;
            --success: #16a34a;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 { text-align: center; color: var(--primary); margin-bottom: 10px; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 30px; font-size: 0.95rem; }

        fieldset {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        legend {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--primary);
            padding: 0 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .form-group.full-width { grid-column: 1 / -1; }

        label {
            font-weight: 500;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .required { color: var(--error); }

        input, select, textarea {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Validation States */
        input.invalid, select.invalid, textarea.invalid {
            border-color: var(--error);
            background-color: #fef2f2;
        }

        input.valid, select.valid, textarea.valid {
            border-color: var(--success);
        }

        .error-message {
            color: var(--error);
            font-size: 0.8rem;
            margin-top: 4px;
            min-height: 18px;
            display: block;
        }

        textarea { resize: vertical; min-height: 80px; }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover { background-color: var(--primary-hover); }
        .btn-submit:disabled { background-color: #94a3b8; cursor: not-allowed; }

        .success-msg {
            display: none;
            background-color: #dcfce7;
            color: var(--success);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .container { padding: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Job Application Form</h1>
    <p class="subtitle">Please fill in your details accurately. Fields marked with <span class="required">*</span> are mandatory.</p>

    <form id="jobApplicationForm" novalidate>
        <!-- Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="fullName">Full Name <span class="required">*</span></label>
                    <input type="text" id="fullName" name="fullName" placeholder="e.g., John Doe" required>
                    <span class="error-message" id="fullNameError"></span>
                </div>
                <div class="form-group">
                    <label for="dob">Date of Birth <span class="required">*</span></label>
                    <input type="date" id="dob" name="dob" required>
                    <span class="error-message" id="dobError"></span>
                </div>
                <div class="form-group">
                    <label for="gender">Gender <span class="required">*</span></label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                    <span class="error-message" id="genderError"></span>
                </div>
                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="example@domain.com" required>
                    <span class="error-message" id="emailError"></span>
                </div>
                <div class="form-group">
                    <label for="mobile">Mobile Number <span class="required">*</span></label>
                    <input type="tel" id="mobile" name="mobile" placeholder="10-digit number" maxlength="10" required>
                    <span class="error-message" id="mobileError"></span>
                </div>
                <div class="form-group full-width">
                    <label for="address">Address <span class="required">*</span></label>
                    <textarea id="address" name="address" placeholder="Street address, apartment, etc." required></textarea>
                    <span class="error-message" id="addressError"></span>
                </div>
                <div class="form-group">
                    <label for="city">City <span class="required">*</span></label>
                    <input type="text" id="city" name="city" required>
                    <span class="error-message" id="cityError"></span>
                </div>
                <div class="form-group">
                    <label for="state">State <span class="required">*</span></label>
                    <input type="text" id="state" name="state" required>
                    <span class="error-message" id="stateError"></span>
                </div>
                <div class="form-group">
                    <label for="pincode">PIN Code <span class="required">*</span></label>
                    <input type="text" id="pincode" name="pincode" placeholder="6-digit PIN" maxlength="6" required>
                    <span class="error-message" id="pincodeError"></span>
                </div>
            </div>
        </fieldset>

        <!-- Educational Qualification -->
        <fieldset>
            <legend>Educational Qualification</legend>
            <div class="form-grid">
                <div class="form-group">
                    <label for="qualification">Highest Qualification <span class="required">*</span></label>
                    <select id="qualification" name="qualification" required>
                        <option value="">Select Qualification</option>
                        <option value="High School">High School</option>
                        <option value="Diploma">Diploma</option>
                        <option value="Bachelor's">Bachelor's Degree</option>
                        <option value="Master's">Master's Degree</option>
                        <option value="Ph.D.">Ph.D.</option>
                    </select>
                    <span class="error-message" id="qualificationError"></span>
                </div>
                <div class="form-group">
                    <label for="university">University / Institute <span class="required">*</span></label>
                    <input type="text" id="university" name="university" required>
                    <span class="error-message" id="universityError"></span>
                </div>
                <div class="form-group">
                    <label for="passingYear">Passing Year <span class="required">*</span></label>
                    <input type="number" id="passingYear" name="passingYear" placeholder="e.g., 2023" min="1980" max="2030" required>
                    <span class="error-message" id="passingYearError"></span>
                </div>
                <div class="form-group">
                    <label for="cgpa">CGPA / Percentage <span class="required">*</span></label>
                    <input type="number" id="cgpa" name="cgpa" placeholder="e.g., 8.5" step="0.01" min="0" max="100" required>
                    <span class="error-message" id="cgpaError"></span>
                </div>
            </div>
        </fieldset>

        <!-- Professional Information -->
        <fieldset>
            <legend>Professional Information</legend>
            <div class="form-grid">
                <div class="form-group">
                    <label for="jobPosition">Applying For / Job Position <span class="required">*</span></label>
                    <input type="text" id="jobPosition" name="jobPosition" placeholder="e.g., Software Engineer" required>
                    <span class="error-message" id="jobPositionError"></span>
                </div>
                <div class="form-group">
                    <label for="experience">Total Work Experience (Years) <span class="required">*</span></label>
                    <input type="number" id="experience" name="experience" placeholder="e.g., 3" min="0" max="50" required>
                    <span class="error-message" id="experienceError"></span>
                </div>
                <div class="form-group full-width">
                    <label for="organization">Current / Previous Organization <span class="required">*</span></label>
                    <input type="text" id="organization" name="organization" required>
                    <span class="error-message" id="organizationError"></span>
                </div>
                <div class="form-group">
                    <label for="expectedSalary">Expected Salary (Annual) <span class="required">*</span></label>
                    <input type="number" id="expectedSalary" name="expectedSalary" placeholder="e.g., 800000" min="0" required>
                    <span class="error-message" id="expectedSalaryError"></span>
                </div>
            </div>
        </fieldset>

        <!-- Technical Skills -->
        <fieldset>
            <legend>Technical Skills</legend>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="programmingSkills">Programming Skills <span class="required">*</span></label>
                    <textarea id="programmingSkills" name="programmingSkills" placeholder="e.g., Java, Python, C++, JavaScript" required></textarea>
                    <span class="error-message" id="programmingSkillsError"></span>
                </div>
                <div class="form-group full-width">
                    <label for="certifications">Certifications</label>
                    <textarea id="certifications" name="certifications" placeholder="e.g., AWS Certified, Oracle Java SE (Optional)"></textarea>
                    <span class="error-message" id="certificationsError"></span>
                </div>
            </div>
        </fieldset>

        <button type="submit" class="btn-submit" id="submitBtn">Submit Application</button>
        <div class="success-msg" id="successMsg">✅ Application submitted successfully! We will contact you soon.</div>
    </form>
</div>

<script>
    // Utility function to show error
    function showError(inputId, message) {
        const input = document.getElementById(inputId);
        const errorSpan = document.getElementById(inputId + 'Error');
        input.classList.add('invalid');
        input.classList.remove('valid');
        if (errorSpan) errorSpan.textContent = message;
    }

    // Utility function to clear error / show success
    function clearError(inputId) {
        const input = document.getElementById(inputId);
        const errorSpan = document.getElementById(inputId + 'Error');
        input.classList.remove('invalid');
        input.classList.add('valid');
        if (errorSpan) errorSpan.textContent = '';
    }

    // Validation Rules
    const validators = {
        fullName: (val) => {
            if (!val.trim()) return "Full name is required.";
            if (val.trim().length < 3) return "Name must be at least 3 characters.";
            if (!/^[a-zA-Z\s]+$/.test(val)) return "Name should only contain letters.";
            return "";
        },
        dob: (val) => {
            if (!val) return "Date of birth is required.";
            const dob = new Date(val);
            const today = new Date();
            let age = today.getFullYear() - dob.getFullYear();
            const m = today.getMonth() - dob.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
            if (age < 18) return "You must be at least 18 years old.";
            if (dob > today) return "Date of birth cannot be in the future.";
            return "";
        },
        gender: (val) => !val ? "Please select a gender." : "",
        email: (val) => {
            if (!val) return "Email is required.";
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return !regex.test(val) ? "Please enter a valid email address." : "";
        },
        mobile: (val) => {
            if (!val) return "Mobile number is required.";
            return !/^[0-9]{10}$/.test(val) ? "Enter a valid 10-digit mobile number." : "";
        },
        address: (val) => !val.trim() ? "Address is required." : "",
        city: (val) => !val.trim() ? "City is required." : "",
        state: (val) => !val.trim() ? "State is required." : "",
        pincode: (val) => {
            if (!val) return "PIN code is required.";
            return !/^[0-9]{6}$/.test(val) ? "Enter a valid 6-digit PIN code." : "";
        },
        qualification: (val) => !val ? "Please select your highest qualification." : "",
        university: (val) => !val.trim() ? "University name is required." : "",
        passingYear: (val) => {
            if (!val) return "Passing year is required.";
            const year = parseInt(val);
            const currentYear = new Date().getFullYear();
            if (year < 1980 || year > currentYear) return `Year must be between 1980 and ${currentYear}.`;
            return "";
        },
        cgpa: (val) => {
            if (!val) return "CGPA/Percentage is required.";
            const num = parseFloat(val);
            if (num < 0 || num > 100) return "Enter a valid score (0 - 100).";
            return "";
        },
        jobPosition: (val) => !val.trim() ? "Job position is required." : "",
        experience: (val) => {
            if (val === "") return "Work experience is required.";
            if (parseInt(val) < 0) return "Experience cannot be negative.";
            return "";
        },
        organization: (val) => !val.trim() ? "Organization name is required." : "",
        expectedSalary: (val) => {
            if (val === "") return "Expected salary is required.";
            if (parseInt(val) < 0) return "Salary cannot be negative.";
            return "";
        },
        programmingSkills: (val) => !val.trim() ? "Please list your programming skills." : ""
    };

    // Attach real-time validation to all inputs
    Object.keys(validators).forEach(id => {
        const element = document.getElementById(id);
        if (element) {
            // Validate on blur (when leaving the field) and input (while typing)
            ['blur', 'input'].forEach(eventType => {
                element.addEventListener(eventType, () => {
                    const errorMsg = validators[id](element.value);
                    if (errorMsg) {
                        showError(id, errorMsg);
                    } else {
                        clearError(id);
                    }
                });
            });
        }
    });

    // Form Submission Handling
    document.getElementById('jobApplicationForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent default submission
       
        let isFormValid = true;
        let firstInvalidField = null;

        // Run all validators
        Object.keys(validators).forEach(id => {
            const element = document.getElementById(id);
            const errorMsg = validators[id](element.value);
           
            if (errorMsg) {
                showError(id, errorMsg);
                isFormValid = false;
                if (!firstInvalidField) firstInvalidField = element;
            } else {
                clearError(id);
            }
        });

        if (!isFormValid) {
            // Scroll to the first error
            firstInvalidField.scrollIntoView({ behavior: 'smooth', block: 'center' });
            firstInvalidField.focus();
            return;
        }

        // If valid, simulate submission
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting...";

        setTimeout(() => {
            document.getElementById('successMsg').style.display = 'block';
            submitBtn.textContent = "Submitted";
            // In a real scenario, you would send the data to a server here using fetch() or AJAX
            console.log("Form Data Submitted:", new FormData(this));
        }, 1000);
    });
</script>

</body>
</html>
