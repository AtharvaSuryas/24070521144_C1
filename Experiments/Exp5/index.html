<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24070521144</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      color: #333;
    }

    .container {
      max-width: 500px;
    }

    h2 {
      margin-bottom: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #f4f4f4;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    input, button {
      padding: 6px 10px;
      margin-top: 4px;
    }

    button {
      cursor: pointer;
    }

    .summary {
      border-top: 2px solid #333;
      padding-top: 10px;
      margin-top: 15px;
    }

    .summary div {
      margin-bottom: 5px;
    }

    .total {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Shopping Cart</h2>

    <!-- Cart Table -->
    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>Price (₹)</th>
          <th>Qty</th>
          <th>Subtotal (₹)</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="cart-items">
        <!-- Rendered via JS -->
      </tbody>
    </table>

    <!-- Summary -->
    <div class="summary">
      <div>Subtotal: ₹<span id="subtotal">0.00</span></div>
      <div>Discount Tier: <span id="discount-tier">0%</span></div>
      <div>Discount Applied: -₹<span id="discount">0.00</span></div>
      <div class="total">Final Total: ₹<span id="final-total">0.00</span></div>
    </div>
  </div>

  <script>
    // 1. Array of Product Objects (Data Model)
    let cart = [
      { id: 1, name: "Headphones", price: 1200.00, quantity: 1 },
      { id: 2, name: "Mouse", price: 450.00, quantity: 2 },
      { id: 3, name: "USB Cable", price: 200.00, quantity: 3 }
    ];

    // Function to render items and recalculate total
    function renderCart() {
      const cartBody = document.getElementById("cart-items");
      cartBody.innerHTML = "";

      // Array Method: .map() to generate table rows
      const rowsHtml = cart.map(item => {
        const itemSubtotal = item.price * item.quantity;
        return `
          <tr>
            <td>${item.name}</td>
            <td>₹${item.price.toFixed(2)}</td>
            <td>
              <input type="number" min="1" value="${item.quantity}" 
                     onchange="updateQuantity(${item.id}, this.value)">
            </td>
            <td>₹${itemSubtotal.toFixed(2)}</td>
            <td>
              <button onclick="removeItem(${item.id})">Remove</button>
            </td>
          </tr>
        `;
      }).join("");

      cartBody.innerHTML = rowsHtml;
      calculateTotals();
    }

    // Function to calculate subtotal, tier discount, and final total
    function calculateTotals() {
      // Array Method: .reduce() to calculate grand subtotal
      const rawSubtotal = cart.reduce((acc, item) => {
        return acc + (item.price * item.quantity);
      }, 0);

      let discountRate = 0;

      // Slab Discount Logic based on Subtotal
      if (rawSubtotal >= 3000) {
        discountRate = 0.30; // 30% off
      } else if (rawSubtotal >= 2000) {
        discountRate = 0.20; // 20% off
      } else if (rawSubtotal >= 1000) {
        discountRate = 0.10; // 10% off
      }

      const discountAmount = rawSubtotal * discountRate;
      const finalTotal = rawSubtotal - discountAmount;

      // DOM Updates
      document.getElementById("subtotal").innerText = rawSubtotal.toFixed(2);
      document.getElementById("discount-tier").innerText = (discountRate * 100) + "%";
      document.getElementById("discount").innerText = discountAmount.toFixed(2);
      document.getElementById("final-total").innerText = finalTotal.toFixed(2);
    }

    // Function to update item quantity (Object Handling)
    function updateQuantity(id, newQty) {
      const qty = parseInt(newQty);
      if (isNaN(qty) || qty < 1) return;

      // Object Handling: Finding and updating item properties
      const item = cart.find(i => i.id === id);
      if (item) {
        item.quantity = qty;
      }
      renderCart();
    }

    // Function to remove item using Array Method: .filter()
    function removeItem(id) {
      cart = cart.filter(item => item.id !== id);
      renderCart();
    }

    // Initial render
    renderCart();
  </script>
</body>
</html>
