<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Traversal To-Do App</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 24px; /* Gives some breathing room from the screen edge */
      display: block; /* Removed centering alignment */
    }

    .todo-card {
      background: white;
      padding: 32px; /* Increased padding */
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 550px; /* Increased width from 400px to 550px */
    }

    h2 {
      margin-top: 0;
      color: #1f2937;
      font-size: 28px; /* Slightly larger heading */
    }

    #todo-form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    #todo-input, .edit-input {
      flex: 1;
      padding: 12px; /* Increased input padding */
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 16px; /* Larger font size */
    }

    button {
      padding: 12px 20px; /* Increased button padding */
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
    }

    #add-btn {
      background-color: #2563eb;
      color: white;
    }

    #add-btn:hover {
      background-color: #1d4ed8;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 10px; /* Increased row padding */
      border-bottom: 1px solid #f3f4f6;
      gap: 12px;
    }

    /* Checkbox styling */
    .todo-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      font-size: 16px; /* Increased text font size */
      color: #374151;
      word-break: break-all;
      transition: all 0.2s ease;
    }

    /* Completed state styling */
    .completed {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .edit-btn { background-color: #f59e0b; color: white; }
    .edit-btn:hover { background-color: #d97706; }

    .save-btn { background-color: #10b981; color: white; }
    .save-btn:hover { background-color: #059669; }

    .delete-btn { background-color: #ef4444; color: white; }
    .delete-btn:hover { background-color: #dc2626; }
  </style>
</head>
<body>

  <div class="todo-card">
    <h2>My Tasks</h2>
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="Add a new task..." required autocomplete="off">
      <button type="submit" id="add-btn">Add</button>
    </form>
    
    <ul id="todo-list">
      <!-- Dynamic list items are injected here -->
    </ul>
  </div>

  <script>
    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const todoList = document.getElementById('todo-list');

    // --- 1. ADD FEATURE (With Checkbox) ---
    todoForm.addEventListener('submit', function(event) {
      event.preventDefault();

      const taskText = todoInput.value.trim();
      if (taskText === '') return;

      const li = document.createElement('li');
      li.innerHTML = `
        <input type="checkbox" class="todo-checkbox">
        <span class="task-text">${taskText}</span>
        <div class="btn-group">
          <button class="edit-btn">Edit</button>
          <button class="delete-btn">Delete</button>
        </div>
      `;

      todoList.appendChild(li);
      todoInput.value = '';
    });

    // --- EVENT DELEGATION (DOM Traversal & Actions) ---
    todoList.addEventListener('click', function(event) {
      const target = event.target;

      // --- 2. DELETE FEATURE ---
      if (target.classList.contains('delete-btn')) {
        const li = target.closest('li');
        li.remove();
      }

      // --- 3. EDIT FEATURE ---
      else if (target.classList.contains('edit-btn')) {
        const li = target.closest('li');
        const taskTextSpan = li.querySelector('.task-text');
        const currentText = taskTextSpan.textContent;
        
        // Check if the current task was already marked completed
        const isCompleted = taskTextSpan.classList.contains('completed');

        // We replace the internal text and buttons, keeping the checkbox intact
        li.innerHTML = `
          <input type="checkbox" class="todo-checkbox" ${isCompleted ? 'checked' : ''}>
          <input type="text" class="edit-input" value="${currentText}">
          <div class="btn-group">
            <button class="save-btn">Save</button>
            <button class="delete-btn">Delete</button>
          </div>
        `;
        
        li.querySelector('.edit-input').focus();
      }

      // --- 4. SAVE FEATURE ---
      else if (target.classList.contains('save-btn')) {
        const li = target.closest('li');
        const editInput = li.querySelector('.edit-input');
        const updatedText = editInput.value.trim();
        const checkbox = li.querySelector('.todo-checkbox');

        if (updatedText === '') {
          alert('Task item text cannot be empty!');
          return;
        }

        // Re-render layout, maintaining the checkbox state
        li.innerHTML = `
          <input type="checkbox" class="todo-checkbox" ${checkbox.checked ? 'checked' : ''}>
          <span class="task-text ${checkbox.checked ? 'completed' : ''}">${updatedText}</span>
          <div class="btn-group">
            <button class="edit-btn">Edit</button>
            <button class="delete-btn">Delete</button>
          </div>
        `;
      }
    });

    // --- 5. CHECKBOX TOGGLE FEATURE (DOM Traversal to update sibling node style) ---
    todoList.addEventListener('change', function(event) {
      const target = event.target;

      if (target.classList.contains('todo-checkbox')) {
        const li = target.closest('li');
        const taskTextSpan = li.querySelector('.task-text');
        
        // Toggle the .completed CSS rule based on checkbox state
        if (target.checked) {
          taskTextSpan.classList.add('completed');
        } else {
          taskTextSpan.classList.remove('completed');
        }
      }
    });
  </script>
</body>
</html>
